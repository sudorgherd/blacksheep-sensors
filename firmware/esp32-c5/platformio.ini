[platformio]
default_envs = c5_bringup

[env:c5_bringup]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = espidf
board = blacksheep_esp32c5_wroom_1u_n32r8
upload_protocol = esptool
monitor_speed = 115200
monitor_filters = direct
monitor_dtr = 0
monitor_rts = 0
extra_scripts = post:scripts/native_bootloader.py

[env:c5_5ghz_validation]
extends = env:c5_bringup
build_flags = -DWIFI_VALIDATION_5GHZ=1

[env:c5_passive_validation]
extends = env:c5_bringup
build_flags = -DWIFI_PASSIVE_VALIDATION=1

[env:c5_passive_5ghz_validation]
extends = env:c5_bringup
build_flags =
    -DWIFI_PASSIVE_VALIDATION=1
    -DWIFI_VALIDATION_5GHZ=1

[env:c5_channel_control_24ghz]
extends = env:c5_bringup
build_flags = -DWIFI_CHANNEL_CONTROL_VALIDATION=1

[env:c5_channel_control_5ghz]
extends = env:c5_bringup
build_flags =
    -DWIFI_CHANNEL_CONTROL_VALIDATION=1
    -DWIFI_VALIDATION_5GHZ=1

[env:c5_metadata_24ghz]
extends = env:c5_bringup
build_flags = -DWIFI_METADATA_CHARACTERIZATION=1

[env:c5_metadata_5ghz]
extends = env:c5_bringup
build_flags =
    -DWIFI_METADATA_CHARACTERIZATION=1
    -DWIFI_VALIDATION_5GHZ=1

[env:c5_v020_stage1_24ghz]
extends = env:c5_bringup
build_flags = -DWIFI_STAGE1_CAPTURE=1

[env:c5_v020_stage1_5ghz]
extends = env:c5_bringup
build_flags =
    -DWIFI_STAGE1_CAPTURE=1
    -DWIFI_VALIDATION_5GHZ=1

[env:c5_v020_stage2_24ghz]
extends = env:c5_bringup
build_flags =
    -DWIFI_STAGE1_CAPTURE=1
    -DWIFI_STAGE2_CAPTURE=1

[env:c5_v020_stage2_5ghz]
extends = env:c5_bringup
build_flags =
    -DWIFI_STAGE1_CAPTURE=1
    -DWIFI_STAGE2_CAPTURE=1
    -DWIFI_VALIDATION_5GHZ=1

[env:c5_v020_stage3_24ghz]
extends = env:c5_bringup
build_flags =
    -DWIFI_STAGE1_CAPTURE=1
    -DWIFI_STAGE2_CAPTURE=1
    -DWIFI_STAGE3_CAPTURE=1

[env:c5_v020_stage3_5ghz]
extends = env:c5_bringup
build_flags =
    -DWIFI_STAGE1_CAPTURE=1
    -DWIFI_STAGE2_CAPTURE=1
    -DWIFI_STAGE3_CAPTURE=1
    -DWIFI_VALIDATION_5GHZ=1

[env:c5_v020_stage4_24ghz]
extends = env:c5_bringup
build_flags =
    -DWIFI_STAGE1_CAPTURE=1
    -DWIFI_STAGE2_CAPTURE=1
    -DWIFI_STAGE3_CAPTURE=1
    -DWIFI_STAGE4_CAPTURE=1

[env:c5_v020_stage4_5ghz]
extends = env:c5_bringup
build_flags =
    -DWIFI_STAGE1_CAPTURE=1
    -DWIFI_STAGE2_CAPTURE=1
    -DWIFI_STAGE3_CAPTURE=1
    -DWIFI_STAGE4_CAPTURE=1
    -DWIFI_VALIDATION_5GHZ=1

[env:c5_v020_stage5_24ghz]
extends = env:c5_bringup
build_flags =
    -DWIFI_STAGE1_CAPTURE=1
    -DWIFI_STAGE2_CAPTURE=1
    -DWIFI_STAGE3_CAPTURE=1
    -DWIFI_STAGE4_CAPTURE=1
    -DWIFI_STAGE5_CAPTURE=1
    -DWIFI_STAGE5_VALIDATION_CHANNEL=5

[env:c5_v020_stage5_5ghz]
extends = env:c5_bringup
build_flags =
    -DWIFI_STAGE1_CAPTURE=1
    -DWIFI_STAGE2_CAPTURE=1
    -DWIFI_STAGE3_CAPTURE=1
    -DWIFI_STAGE4_CAPTURE=1
    -DWIFI_STAGE5_CAPTURE=1
    -DWIFI_VALIDATION_5GHZ=1
    -DWIFI_STAGE5_VALIDATION_CHANNEL=48

[env:c5_v020_stage6_24ghz]
extends = env:c5_v020_stage5_24ghz
build_flags =
    ${env:c5_v020_stage5_24ghz.build_flags}
    -DWIFI_STAGE6_CAPTURE=1

[env:c5_v020_stage6_5ghz]
extends = env:c5_v020_stage5_5ghz
build_flags =
    ${env:c5_v020_stage5_5ghz.build_flags}
    -DWIFI_STAGE6_CAPTURE=1
